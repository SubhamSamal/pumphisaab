# Nightly backup of the live database (D93). Read-only on the live project: it only copies.
# The copy is encrypted with the owner's passphrase before it's stored, because this repo is
# public. Kept 30 days. Restore is proven by restore-test.yml.
# Needs two GitHub secrets (the owner adds them): SUPABASE_DB_URL (session pooler address with
# the database password) and BACKUP_PASSPHRASE. Without them the job says so and stops.
name: Nightly backup

on:
  schedule:
    - cron: "30 20 * * *" # 02:00 IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Secrets present?
        id: ready
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DB_URL" ] || [ -z "$PASS" ]; then
            echo "Backup not set up yet: add SUPABASE_DB_URL and BACKUP_PASSPHRASE in GitHub › Settings › Secrets."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.ready.outputs.ok == 'true'
        with:
          version: latest
      - name: Copy the database (roles, structure, data incl. logins)
        if: steps.ready.outputs.ok == 'true'
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir backup
          supabase db dump --db-url "$DB_URL" -f backup/roles.sql --role-only
          supabase db dump --db-url "$DB_URL" -f backup/schema.sql
          supabase db dump --db-url "$DB_URL" -f backup/data.sql --use-copy --data-only
          ls -la backup
          test -s backup/data.sql
      - name: Encrypt
        if: steps.ready.outputs.ok == 'true'
        env:
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          name="pumphisaab-$(TZ=Asia/Kolkata date +%Y-%m-%d)"
          tar czf "$name.tar.gz" -C backup .
          gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$PASS" -o "$name.tar.gz.gpg" "$name.tar.gz"
          rm -rf backup "$name.tar.gz"
          echo "NAME=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        if: steps.ready.outputs.ok == 'true'
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.tar.gz.gpg
          retention-days: 30
          if-no-files-found: error
